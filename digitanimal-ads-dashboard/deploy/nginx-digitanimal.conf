# digitanimal-ads.pmediaplus.com (canónico) — Next.js digitanimal-ads-dashboard
# Install:
#   sudo cp /opt/apps/digitanimal-ads-dashboard/deploy/nginx-digitanimal.conf /etc/nginx/sites-available/digitanimal
#   sudo ln -sf /etc/nginx/sites-available/digitanimal /etc/nginx/sites-enabled/digitanimal
#   sudo nginx -t && sudo systemctl reload nginx
# SSL (DNS A → este VPS):
#   sudo certbot --nginx -d digitanimal-ads.pmediaplus.com -d digitanimal.pmediaplus.com

upstream digitanimal_ads {
    server 127.0.0.1:3025;
}

server {
    listen 80;
    listen [::]:80;
    server_name digitanimal-ads.pmediaplus.com digitanimal.pmediaplus.com;

    client_max_body_size 4M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Evita que el navegador reutilice el 404/landing antiguos tras el cambio de DNS.
    location /_next/static/ {
        proxy_pass http://digitanimal_ads;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://digitanimal_ads;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }
}
