# digitanimal.pmediaplus.com — Next.js (digitanimal-ads-dashboard)
# Install:
#   sudo cp /opt/apps/digitanimal-ads-dashboard/deploy/nginx-digitanimal.conf /etc/nginx/sites-available/digitanimal
#   sudo ln -sf /etc/nginx/sites-available/digitanimal /etc/nginx/sites-enabled/digitanimal
#   sudo nginx -t && sudo systemctl reload nginx
# SSL (DNS A → este VPS):
#   sudo certbot --nginx -d digitanimal.pmediaplus.com

upstream digitanimal_ads {
    server 127.0.0.1:3025;
}

server {
    listen 80;
    listen [::]:80;
    server_name digitanimal.pmediaplus.com;

    client_max_body_size 4M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://digitanimal_ads;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
