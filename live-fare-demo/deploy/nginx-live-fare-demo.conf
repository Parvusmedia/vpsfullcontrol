# HTTP-only fallback (used until Let's Encrypt files exist).
# deploy.sh switches this site to HTTP→HTTPS + 443 when the cert is on disk.
server {
    listen 80;
    listen [::]:80;
    server_name flights.pmediaplus.com;

    # ACME HTTP-01 (certbot). Do not proxy this path.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    include /etc/nginx/snippets/live-fare-locations.conf;
}
