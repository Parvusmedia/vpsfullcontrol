server {
    listen 80;
    listen [::]:80;
    server_name flights.pmediaplus.com;

    # ACME HTTP-01 (certbot). Do not proxy this path.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    root /opt/apps/live-fare-demo;

    location = /health {
        root /opt/apps/live-fare-demo/feed/public;
        try_files /health.json =404;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Type "application/json; charset=utf-8" always;
        access_log /var/log/nginx/live-fare-health.access.log;
    }

    # Static fare feed. Impressions never hit Python.
    location /fares/ {
        alias /opt/apps/live-fare-demo/feed/public/;
        default_type application/json;

        # TTL FEED — change max-age here, then: sudo nginx -t && sudo systemctl reload nginx
        add_header Cache-Control "public, max-age=30" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Content-Type "application/json; charset=utf-8" always;

        # Do not log every creative impression.
        access_log off;
    }

    location = /demo {
        return 302 /demo/;
    }

    location /demo/ {
        alias /opt/apps/live-fare-demo/demo/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    location /creative/ {
        alias /opt/apps/live-fare-demo/creative/;
        add_header Cache-Control "no-cache";
    }

    location /dist/ {
        alias /opt/apps/live-fare-demo/dist/;
        add_header Cache-Control "no-cache";
    }

    location = / {
        return 302 /demo;
    }
}
