<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue — EDU Advisor</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/demo.css">
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <div class="brand"><span>Demo University</span><strong>Programme catalogue</strong></div>
    </nav>

    <div id="demo-map-mount" class="demo-map-mount"></div>
    <div id="demo-here-mount"></div>

    <header class="hero hero-step">
      <p class="kicker">Programme catalogue</p>
      <h1>Structured data, not model memory.</h1>
      <p class="lede">Places, study modes, and entry requirements for each programme in the advisor.</p>
    </header>

    <div id="cats"></div>
    <p class="footnote"><a href="/">Home</a> · <a href="/orientador">Advisor</a></p>
  </div>
  <script src="/shared.js"></script>
  <script src="/demo.js"></script>
  <script>EDU.mountDemoChrome();</script>
  <script>
    EDU.api("/api/programmes").then(function (data) {
      document.getElementById("cats").innerHTML = data.programmes.map(function (p) {
        return '<article class="card" style="margin:16px 0">' +
          '<h2 class="program-title">' + p.name + '</h2>' +
          '<div class="meta"><span class="pill">' + (p.modality_es || p.modality) + '</span><span class="pill">' + p.ects + ' ECTS</span><span class="pill">' + p.places + ' places</span></div>' +
          '<p><b>Areas</b> ' + p.areas.join(", ") + '</p>' +
          '<p><b>Ideal profiles</b> ' + p.ideal_profiles.join(", ") + '</p>' +
          '<p><b>Goals</b> ' + p.goals.join(", ") + '</p>' +
          '<p><b>Preferred entry</b> ' + (p.eligibility.preferred_backgrounds || []).join(", ") + '</p>' +
          '<p><b>Bridging courses</b> ' + (p.eligibility.additional_training_possible ? "available" : "not listed") + '</p>' +
          '<p class="footnote">' + (p.approved_facts || []).join(" ") + '</p>' +
        '</article>';
      }).join("");
    });
  </script>
</body>
</html>
