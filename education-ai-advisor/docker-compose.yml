services:
  advisor:
    image: python:3.12-slim
    working_dir: /app
    command: >
      bash -lc "pip install -q -r backend/requirements.txt &&
      uvicorn main:app --app-dir backend --host 0.0.0.0 --port 8022"
    environment:
      AI_MODE: mock
      EDU_DATA_DIR: /app/backend/storage
      EDU_FRONTEND_DIR: /app/frontend
    volumes:
      - ./:/app
    ports:
      - "127.0.0.1:8022:8022"

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8091:80"
    depends_on:
      - advisor
