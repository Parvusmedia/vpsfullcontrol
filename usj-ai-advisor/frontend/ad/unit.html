<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="color-scheme" content="light">
  <title>USJ</title>
  <style>
    :root {
      --navy: #0b1f3a;
      --navy-2: #143056;
      --cross: #c8102e;
      --gold: #c9a227;
      --paper: #f4f1ea;
      --white: #ffffff;
      --ink: #101828;
      --muted: rgba(16, 24, 40, 0.62);
      --line: rgba(11, 31, 58, 0.14);
    }
    html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: var(--navy); color: var(--ink); }
    body { font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    * { box-sizing: border-box; }
    .unit {
      height: 100%; width: 100%; overflow: hidden;
      display: flex; flex-direction: column;
      background: var(--paper);
    }
    .hero {
      position: relative; flex: none;
      background: var(--navy) center/cover no-repeat;
      color: #fff;
      padding: 10px 12px 12px;
    }
    .sz-300x600 .hero { background-image: linear-gradient(180deg, rgba(11,31,58,.35) 0%, rgba(11,31,58,.78) 100%), url("/ad/img/campus-arch.jpg"); height: 168px; display: flex; flex-direction: column; justify-content: flex-end; }
    .sz-300x250 .hero { background-image: linear-gradient(90deg, rgba(11,31,58,.82) 0%, rgba(11,31,58,.45) 100%), url("/ad/img/campus-wide.jpg"); min-height: 58px; padding: 8px 10px; }
    .sz-970x250 { flex-direction: row; }
    .sz-970x250 .hero { background-image: linear-gradient(180deg, rgba(11,31,58,.25) 0%, rgba(11,31,58,.72) 100%), url("/ad/img/campus-wide.jpg"); width: 340px; height: 100%; padding: 14px 16px; display: flex; flex-direction: column; justify-content: flex-end; }
    .hero:after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
      background: linear-gradient(90deg, var(--cross), var(--gold));
    }
    .logo { display: flex; align-items: center; gap: 8px; }
    .mark { width: 22px; height: 26px; flex: none; }
    .brand { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; line-height: 1.25; }
    .brand strong { display: block; font-size: 12px; letter-spacing: .04em; font-weight: 800; }
    .kicker { margin: 8px 0 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
    .hero h1, .hero .score, .hero .name { color: #fff; }
    .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 12px 10px; background: var(--paper); }
    .sz-970x250 .panel { width: 630px; padding: 12px 14px 12px 16px; }
    .step { margin: 0 0 4px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    h1 { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; font-size: 18px; line-height: 1.15; margin: 0 0 8px; font-weight: 700; color: var(--navy); }
    .sub { font-size: 11px; color: var(--muted); margin: 0 0 8px; line-height: 1.35; }
    .remain { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 8px; }
    .tag { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; font-size: 10px; color: var(--navy); font-weight: 600; }
    .tag.off { opacity: .4; text-decoration: line-through; }
    .opts { display: flex; flex-direction: column; gap: 6px; overflow: hidden; flex: 1; min-height: 0; }
    .opt {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 9px 10px;
      text-align: left;
      font-size: 12px;
      cursor: pointer;
      color: var(--navy);
      width: 100%;
      line-height: 1.25;
      font-weight: 600;
      box-shadow: 0 1px 0 rgba(11,31,58,.04);
    }
    .opt:hover, .opt:focus { border-color: var(--gold); outline: none; background: #fffdf6; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
    .cta {
      border: 0; background: var(--navy); color: #fff;
      border-radius: 4px; padding: 10px 12px;
      font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
      cursor: pointer; font-weight: 800;
    }
    .cta:hover { background: var(--navy-2); }
    .ghost { background: #fff; color: var(--navy); border: 1px solid var(--line); }
    .score { font-family: Georgia, serif; font-size: 28px; margin: 0; color: var(--gold); line-height: 1; }
    .name { font-family: Georgia, serif; font-size: 16px; margin: 4px 0 6px; line-height: 1.2; font-weight: 700; color: var(--navy); }
    .is-result .name { color: inherit; }

    .sz-300x250 .panel { padding: 8px 10px 8px; }
    .sz-300x250 h1 { font-size: 15px; margin-bottom: 6px; }
    .sz-300x250 .remain { display: none; }
    .sz-300x250 .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .sz-300x250 .opt { padding: 7px 6px; font-size: 11px; min-height: 36px; }
    .sz-300x250 .opt:last-child { grid-column: 1 / -1; }
    .sz-300x250 .cta { width: 100%; border-radius: 4px; }
    .sz-300x250.is-result .row { flex-direction: column; }
    .sz-300x250.is-result .hero { min-height: 70px; }
    .sz-300x250 .kicker { display: none; }

    .sz-300x600 .opts { flex: 1; }
    .sz-300x600 .opt { font-size: 13px; padding: 10px 12px; flex: 1; display: flex; align-items: center; }
    .sz-300x600 .cta { min-height: 42px; width: 100%; }
    .sz-300x600.is-result .hero { height: 210px; }
    .sz-300x600.is-result .kicker { font-size: 10px; }
    .sz-300x600.is-result h1 { display: none; }

    .sz-970x250 h1 { font-size: 20px; }
    .sz-970x250 .opts { flex-direction: row; flex-wrap: wrap; align-content: flex-start; }
    .sz-970x250 .opt { width: calc(50% - 5px); min-height: 42px; }
    .sz-970x250.is-result .panel { justify-content: center; }
    .sz-970x250.is-result .row { flex-direction: row; margin-top: 10px; }
    .sz-970x250.is-result .cta { min-width: 220px; }
    .sz-970x250 .hero .score, .sz-970x250 .hero .name { color: #fff; }
    .sz-970x250.is-result .name { color: #fff; font-size: 22px; }
    .sz-970x250.is-result .sub { color: rgba(255,255,255,.82); }
  </style>
</head>
<body>
  <div class="unit" id="unit">
    <div class="hero">
      <div class="logo">
        <svg class="mark" viewBox="0 0 24 28" aria-hidden="true"><path d="M12 1.2 L22 5.2 V14.2 C22 20.8 12 26.6 12 26.6 C12 26.6 2 20.8 2 14.2 V5.2 Z" fill="#0b1f3a" stroke="#c9a227" stroke-width="1.2"/><path d="M12 6 V21 M7 12.5 H17" stroke="#c8102e" stroke-width="2.1" stroke-linecap="square"/></svg>
        <div class="brand">Universidad San Jorge<strong>USJ</strong></div>
      </div>
    </div>
    <div class="panel"><h1>Encuentra tu máster</h1></div>
  </div>
  <script src="/shared.js"></script>
  <script>
    (function () {
      var size = new URLSearchParams(location.search).get("size") || "300x600";
      var compact = size === "300x250" || size === "970x250";
      var unit = document.getElementById("unit");
      unit.className = "unit sz-" + size;
      var answers = {};
      var spec = null;
      var step = 0;
      var names = { "ai-applied": "IA Aplicada", marketing: "Marketing", biomechanics: "Biomecánica" };
      var LOGO =
        "<div class=\"logo\">" +
        "<svg class=\"mark\" viewBox=\"0 0 24 28\" aria-hidden=\"true\"><path d=\"M12 1.2 L22 5.2 V14.2 C22 20.8 12 26.6 12 26.6 C12 26.6 2 20.8 2 14.2 V5.2 Z\" fill=\"#ffffff\" fill-opacity=\".12\" stroke=\"#c9a227\" stroke-width=\"1.2\"/><path d=\"M12 6 V21 M7 12.5 H17\" stroke=\"#ffd7dc\" stroke-width=\"2.1\" stroke-linecap=\"square\"/></svg>" +
        "<div class=\"brand\">Universidad San Jorge<strong>USJ</strong></div></div>";

      function api(path, body) {
        if (body) return USJ.api(path, { method: "POST", body: JSON.stringify(body) });
        return USJ.api(path);
      }
      function labelOf(opt) { return compact ? (opt.short_label || opt.label) : opt.label; }
      function paintRemain(data) {
        var html = "";
        (data.remaining || []).forEach(function (row) {
          html += "<span class=\"tag\">" + (names[row.programme_id] || row.programme) + "</span>";
        });
        (data.dropped || []).forEach(function (row) {
          html += "<span class=\"tag off\">" + (names[row.programme_id] || row.programme) + "</span>";
        });
        return html;
      }
      function waCtx(payload) {
        return { programme: payload && payload.best && payload.best.programme, labels: (payload && payload.guide_labels) || [] };
      }
      function bindWhatsApp(id, payload) {
        var btn = document.getElementById(id);
        if (!btn) return;
        btn.onclick = function () { USJ.openWhatsApp(waCtx(payload)); };
      }

      function showStep() {
        unit.className = "unit sz-" + size;
        var s = spec.steps[step];
        unit.innerHTML =
          "<div class=\"hero\">" + LOGO +
          "<p class=\"kicker\">Tu desafío empieza aquí</p></div>" +
          "<div class=\"panel\">" +
          "<p class=\"step\">" + (step + 1) + " / " + spec.steps.length + " · El catálogo se reduce</p>" +
          "<h1>" + s.title + "</h1>" +
          "<div class=\"remain\" id=\"remain\"></div>" +
          "<div class=\"opts\" id=\"opts\"></div></div>";
        s.options.forEach(function (opt) {
          var b = document.createElement("button");
          b.className = "opt";
          b.textContent = labelOf(opt);
          b.onclick = function () { choose(s.id, opt.id); };
          document.getElementById("opts").appendChild(b);
        });
        api("/api/guide", { answers: answers }).then(function (d) {
          var el = document.getElementById("remain");
          if (el) el.innerHTML = paintRemain(d);
        }).catch(function () {});
      }

      function choose(id, option) {
        answers[id] = option;
        USJ.track("priority_selected", { surface: "ad", size: size, step: id, option: option });
        if (step < spec.steps.length - 1) {
          step += 1;
          showStep();
          return;
        }
        USJ.track("profile_submitted", { surface: "ad" });
        api("/api/guide", { answers: answers }).then(showResult).catch(function () { showResult({ fallback: true }); });
      }

      function showResult(payload) {
        USJ.track("recommendation_generated", { surface: "ad", id: payload.best && payload.best.programme_id });
        unit.className = "unit sz-" + size + " is-result";
        if (!payload.best) {
          unit.innerHTML =
            "<div class=\"hero\">" + LOGO + "<p class=\"kicker\">Másteres USJ</p></div>" +
            "<div class=\"panel\"><h1>Hablemos por WhatsApp</h1>" +
            "<p class=\"sub\">Este catálogo demo es limitado.</p>" +
            "<div class=\"row\"><button class=\"cta\" id=\"wa\">Seguir por WhatsApp</button>" +
            "<button class=\"cta ghost\" id=\"again\">Otra vez</button></div></div>";
          bindWhatsApp("wa", payload);
          document.getElementById("again").onclick = restart;
          return;
        }
        var b = payload.best;
        var title = payload.has_strong_match ? "Mejor encaje" : "Opción más cercana";
        var extra = compact ? "" : "<p class=\"sub\">" + (b.reasons || []).slice(0, 2).join(" · ") + "</p>";
        if (size === "970x250") {
          unit.innerHTML =
            "<div class=\"hero\">" + LOGO +
            "<p class=\"kicker\">" + title + "</p>" +
            "<div class=\"name\">" + b.programme + "</div>" +
            "<p class=\"sub\">" + (b.modality_es || "") + " · " + (b.eligibility || "") + "</p></div>" +
            "<div class=\"panel\">" +
            "<p class=\"score\">" + b.score_pct + "%</p>" +
            "<h1>Este máster encaja con tu perfil</h1>" + extra +
            "<div class=\"row\"><button class=\"cta\" id=\"wa\">Seguir por WhatsApp</button>" +
            "<button class=\"cta ghost\" id=\"again\">Otra vez</button></div></div>";
        } else if (size === "300x600") {
          unit.innerHTML =
            "<div class=\"hero\">" + LOGO +
            "<p class=\"kicker\">" + title + "</p>" +
            "<p class=\"score\">" + b.score_pct + "%</p>" +
            "<div class=\"name\">" + b.programme + "</div></div>" +
            "<div class=\"panel\">" +
            "<p class=\"sub\">" + (b.modality_es || "") + " · " + (b.eligibility || "") + "</p>" + extra +
            "<div class=\"row\"><button class=\"cta\" id=\"wa\">Seguir por WhatsApp</button>" +
            "<button class=\"cta ghost\" id=\"again\">Otra vez</button></div></div>";
        } else {
          unit.innerHTML =
            "<div class=\"hero\">" + LOGO +
            "<p class=\"kicker\">" + b.score_pct + "% · " + title + "</p></div>" +
            "<div class=\"panel\">" +
            "<h1>" + b.programme + "</h1>" +
            "<p class=\"sub\">" + (b.modality_es || "") + " · " + (b.eligibility || "") + "</p>" +
            "<div class=\"row\"><button class=\"cta\" id=\"wa\">Seguir por WhatsApp</button>" +
            "<button class=\"cta ghost\" id=\"again\">Otra vez</button></div></div>";
        }
        bindWhatsApp("wa", payload);
        document.getElementById("again").onclick = restart;
      }

      function restart() { answers = {}; step = 0; showStep(); }

      api("/api/guide").then(function (s) { spec = s; showStep(); }).catch(function () {
        unit.innerHTML = "<div class=\"hero\">" + LOGO + "</div><div class=\"panel\"><h1>Encuentra tu máster</h1>" +
          "<button class=\"cta\" id=\"wa\">Seguir por WhatsApp</button></div>";
        bindWhatsApp("wa", {});
      });
    })();
  </script>
</body>
</html>
