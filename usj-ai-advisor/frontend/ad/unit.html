<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="color-scheme" content="light">
  <title>USJ</title>
  <style>
    :root {
      --ink: #173328;
      --forest: #1f4d3a;
      --gold: #c4a056;
      --paper: #f4efe3;
      --cream: #fffdf8;
      --line: rgba(23, 51, 40, 0.16);
    }
    html { background: #f4efe3; color-scheme: light; }
    html, body { margin: 0; height: 100%; width: 100%; background: #f4efe3; color: var(--ink); }
    body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
    * { box-sizing: border-box; }
    .unit {
      height: 100%;
      width: 100%;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f4efe3;
      color: #173328;
    }
    .brand { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--forest); font-weight: 700; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: 20px; line-height: 1.15; margin: 0; font-weight: 600; }
    .sub { font-size: 12px; color: rgba(23,51,40,.72); margin: 4px 0 0; line-height: 1.35; }
    .remain { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .tag { background: var(--cream); border: 1px solid var(--line); border-radius: 999px; padding: 2px 7px; font-size: 10px; }
    .tag.off { opacity: .4; text-decoration: line-through; }
    .opts { display: flex; flex-direction: column; gap: 6px; overflow: auto; flex: 1; min-height: 0; }
    .opt {
      border: 1px solid var(--line);
      background: var(--cream);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: left;
      font-size: 13px;
      cursor: pointer;
      color: var(--ink);
      width: 100%;
      line-height: 1.25;
    }
    .opt:hover, .opt:focus { border-color: var(--gold); outline: none; }
    .cta {
      border: 0;
      background: var(--forest);
      color: #fff8ea;
      border-radius: 999px;
      padding: 9px 12px;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      font-weight: 700;
    }
    .ghost { background: var(--cream); color: var(--forest); border: 1px solid var(--line); }
    .score { font-family: Georgia, serif; font-size: 28px; margin: 0; color: var(--forest); }
    .name { font-family: Georgia, serif; font-size: 16px; margin: 0 0 4px; line-height: 1.2; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
    .copy { flex-shrink: 0; }

    .sz-300x250 { padding: 10px; gap: 6px; }
    .sz-300x250 h1 { font-size: 16px; }
    .sz-300x250 .remain { display: none; }
    .sz-300x250 .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .sz-300x250 .opt { padding: 8px 7px; font-size: 12px; min-height: 42px; }
    .sz-300x250 .score { font-size: 22px; }
    .sz-300x250 .name { font-size: 14px; }

    .sz-300x600 { padding: 14px; }
    .sz-300x600 h1 { font-size: 24px; }
    .sz-300x600 .opt { font-size: 14px; padding: 12px; }

    .sz-970x250 { flex-direction: row; gap: 14px; padding: 14px 16px; }
    .sz-970x250 .copy { width: 280px; }
    .sz-970x250 h1 { font-size: 22px; }
    .sz-970x250 .opts { flex-direction: row; flex-wrap: wrap; align-content: flex-start; }
    .sz-970x250 .opt { width: calc(50% - 6px); min-height: 52px; }
    .sz-970x250 .remain { margin-top: 8px; }
  </style>
</head>
<body>
  <div class="unit" id="unit">
    <div class="brand">Universidad San Jorge</div>
    <h1>Encuentra tu máster</h1>
    <p class="sub">Tres preguntas. El catálogo se va reduciendo.</p>
  </div>
  <script src="/shared.js"></script>
  <script>
    (function () {
      var size = new URLSearchParams(location.search).get("size") || "300x600";
      var compact = size === "300x250" || size === "970x250";
      var unit = document.getElementById("unit");
      unit.className = "unit sz-" + size;
      var answers = {};
      var spec = null;
      var step = 0;
      var names = { "ai-applied": "IA Aplicada", marketing: "Marketing", biomechanics: "Biomecánica" };

      function api(path, body) {
        if (body) return USJ.api(path, { method: "POST", body: JSON.stringify(body) });
        return USJ.api(path);
      }

      function labelOf(opt) {
        if (compact) return opt.short_label || opt.label;
        return opt.label;
      }

      function paintRemain(data) {
        var html = "";
        (data.remaining || []).forEach(function (row) {
          html += "<span class=\"tag\">" + (names[row.programme_id] || row.programme) + "</span>";
        });
        (data.dropped || []).forEach(function (row) {
          html += "<span class=\"tag off\">" + (names[row.programme_id] || row.programme) + "</span>";
        });
        return html || "<span class=\"tag\">3 másteres</span>";
      }

      function showStep() {
        var s = spec.steps[step];
        unit.innerHTML =
          "<div class=\"copy\">" +
          "<div class=\"brand\">Universidad San Jorge</div>" +
          "<h1>" + s.title + "</h1>" +
          "<p class=\"sub\">" + (step + 1) + "/" + spec.steps.length + " · El catálogo se reduce</p>" +
          "<div class=\"remain\" id=\"remain\"></div></div>" +
          "<div class=\"opts\" id=\"opts\"></div>";
        s.options.forEach(function (opt) {
          var b = document.createElement("button");
          b.className = "opt";
          b.textContent = labelOf(opt);
          b.onclick = function () { choose(s.id, opt.id); };
          document.getElementById("opts").appendChild(b);
        });
        api("/api/guide", { answers: answers }).then(function (d) {
          var el = document.getElementById("remain");
          if (el) el.innerHTML = paintRemain(d);
        }).catch(function () {});
      }

      function choose(id, option) {
        answers[id] = option;
        USJ.track("priority_selected", { surface: "ad", size: size, step: id, option: option });
        if (step < spec.steps.length - 1) {
          step += 1;
          showStep();
          return;
        }
        USJ.track("profile_submitted", { surface: "ad" });
        unit.innerHTML = "<div class=\"brand\">Universidad San Jorge</div><h1>Buscando encaje…</h1>";
        api("/api/guide", { answers: answers }).then(showResult).catch(function () {
          showResult({ fallback: true });
        });
      }

      function showResult(payload) {
        USJ.track("recommendation_generated", { surface: "ad", id: payload.best && payload.best.programme_id });
        if (!payload.best) {
          unit.innerHTML =
            "<div class=\"copy\"><div class=\"brand\">Universidad San Jorge</div>" +
            "<h1>Hablemos con un asesor</h1>" +
            "<p class=\"sub\">Este catálogo demo es limitado.</p></div>" +
            "<div class=\"row\"><button class=\"cta\" id=\"talk\">Hablar con un asesor</button>" +
            "<button class=\"cta ghost\" id=\"again\">Otra vez</button></div>";
          document.getElementById("talk").onclick = function () { location.href = "/?from=ad"; };
          document.getElementById("again").onclick = restart;
          return;
        }
        var b = payload.best;
        var alts = (payload.alternatives || []).map(function (a) { return a.programme; }).join(" · ");
        var title = payload.has_strong_match ? "Mejor encaje" : "Opción más cercana";
        unit.innerHTML =
          "<div class=\"copy\">" +
          "<div class=\"brand\">" + title + "</div>" +
          "<p class=\"score\">" + b.score_pct + "%</p>" +
          "<div class=\"name\">" + b.programme + "</div>" +
          "<p class=\"sub\">" + (b.modality_es || b.modality) + " · " + (b.eligibility || "") + "</p>" +
          (compact ? "" : "<p class=\"sub\">" + (b.reasons || []).slice(0, 2).join(" · ") + "</p>") +
          (alts && !compact ? "<p class=\"sub\">También: " + alts + "</p>" : "") +
          "</div>" +
          "<div class=\"row\">" +
          "<button class=\"cta\" id=\"explore\">Explorar</button>" +
          "<button class=\"cta ghost\" id=\"talk\">Asesor</button>" +
          "<button class=\"cta ghost\" id=\"again\">Otra vez</button>" +
          "</div>";
        document.getElementById("explore").onclick = function () {
          USJ.track("programme_viewed", { id: b.programme_id, surface: "ad" });
          USJ.clickThrough(b.url);
        };
        document.getElementById("talk").onclick = function () { location.href = "/?from=ad"; };
        document.getElementById("again").onclick = restart;
      }

      function restart() {
        answers = {};
        step = 0;
        showStep();
      }

      api("/api/guide").then(function (s) {
        spec = s;
        showStep();
      }).catch(function () {
        unit.innerHTML =
          "<div class=\"brand\">Universidad San Jorge</div>" +
          "<h1>Encuentra tu máster</h1>" +
          "<p class=\"sub\">Vamos a ayudarte a encontrar el programa adecuado.</p>" +
          "<button class=\"cta\" id=\"go\">Ver másteres</button>";
        document.getElementById("go").onclick = function () {
          location.href = "https://www.usj.es/estudios/posgrados/masteres";
        };
      });
    })();
  </script>
</body>
</html>
