<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="color-scheme" content="light">
  <title>USJ</title>
  <style>
    @font-face { font-family: InterAd; src: url("/ad/fonts/inter-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: InterAd; src: url("/ad/fonts/inter-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
    @font-face { font-family: InterAd; src: url("/ad/fonts/inter-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    :root {
      --navy: #0a1b33;
      --navy-2: #122844;
      --gold: #c4a35a;
      --cross: #b91c1c;
      --white: #fff;
      --panel: #fff;
      --btn: #f4f6f8;
      --ink: #0a1b33;
      --muted: #5c6775;
      --line: #d9dee6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: var(--navy); }
    body { font-family: InterAd, "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; }
    .unit { height: 100%; width: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--panel); }

    .hero {
      position: relative; flex: none; color: #fff;
      background: var(--navy) center/cover no-repeat;
      padding: 12px 16px;
    }
    .hero:after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
      background: var(--gold);
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .mark { width: 20px; height: 24px; flex: none; }
    .brand { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; line-height: 1.35; opacity: .9; }
    .brand b { display: block; font-size: 13px; letter-spacing: .16em; font-weight: 700; opacity: 1; }
    .kicker { margin: 10px 0 0; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); font-weight: 700; }

    .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px 14px; background: var(--panel); }
    .navline { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; min-height: 24px; }
    .back, .back-ph { width: 24px; height: 24px; flex: none; }
    .back {
      border: 0; background: transparent; color: var(--navy); padding: 0;
      font-size: 16px; line-height: 24px; cursor: pointer; font-weight: 600;
    }
    .progress { display: flex; gap: 4px; flex: 1; }
    .progress i { display: block; height: 2px; flex: 1; background: var(--line); }
    .progress i.on { background: var(--navy); }
    .count { font-size: 10px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }

    h1 { margin: 0 0 10px; font-size: 18px; line-height: 1.25; font-weight: 700; letter-spacing: -.02em; }
    .sub { margin: 0 0 10px; font-size: 12px; line-height: 1.4; color: var(--muted); }
    .remain { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
    .tag { font-size: 10px; font-weight: 600; letter-spacing: .02em; color: var(--navy); background: var(--btn); padding: 4px 8px; }
    .tag.off { display: none; }

    .opts { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overflow: hidden; }
    .opt {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; min-height: 44px; padding: 0 14px;
      border: 1px solid var(--line); background: var(--btn);
      color: var(--ink); text-align: left; font-size: 13px; font-weight: 600;
      line-height: 1.25; cursor: pointer; border-radius: 2px;
    }
    .opt:after { content: "›"; color: var(--gold); font-size: 18px; font-weight: 400; margin-left: 8px; }
    .opt:hover, .opt:focus { background: #fff; border-color: var(--navy); outline: none; }

    .row { display: flex; gap: 8px; margin-top: auto; }
    .cta {
      flex: 1; min-height: 44px; border: 0; background: var(--navy); color: #fff;
      font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      cursor: pointer; border-radius: 2px;
    }
    .cta:hover { background: var(--navy-2); }
    .ghost { flex: 0 0 auto; background: #fff; color: var(--navy); border: 1px solid var(--line); min-width: 88px; }
    .score { margin: 0 0 4px; font-size: 28px; font-weight: 700; letter-spacing: -.03em; color: var(--navy); line-height: 1; }
    .name { margin: 0 0 8px; font-size: 16px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
    .pills { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
    .pill { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 4px 8px; }

    .sz-300x250 .hero { min-height: 46px; padding: 8px 12px; background-image: linear-gradient(90deg, rgba(10,27,51,.88), rgba(10,27,51,.55)), url("/ad/img/campus-wide.jpg"); }
    .sz-300x250 .kicker { display: none; }
    .sz-300x250 .panel { padding: 10px 12px 12px; }
    .sz-300x250 .navline { margin-bottom: 8px; }
    .sz-300x250 h1 { font-size: 15px; margin-bottom: 8px; }
    .sz-300x250 .remain { display: none; }
    .sz-300x250 .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .sz-300x250 .opt { min-height: 38px; padding: 0 10px; font-size: 12px; }
    .sz-300x250 .opt:last-child { grid-column: 1 / -1; }
    .sz-300x250 .row { flex-direction: column; }
    .sz-300x250 .ghost { min-width: 0; width: 100%; }

    .sz-300x600 .hero { height: 154px; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px 16px 16px; background-image: linear-gradient(180deg, rgba(10,27,51,.2) 0%, rgba(10,27,51,.82) 100%), url("/ad/img/campus-arch.jpg"); }
    .sz-300x600 .opt { flex: 1; }
    .sz-300x600 .row { flex-direction: column; }
    .sz-300x600 .ghost { width: 100%; }
    .sz-300x600.is-result .hero { height: 200px; }
    .sz-300x600.is-result .name, .sz-300x600.is-result .score, .sz-300x600.is-result .kicker { color: #fff; }
    .sz-300x600.is-result .score { font-size: 36px; }

    .sz-970x250 { flex-direction: row; }
    .sz-970x250 .hero { width: 300px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px 18px; background-image: linear-gradient(180deg, rgba(10,27,51,.15), rgba(10,27,51,.78)), url("/ad/img/campus-wide.jpg"); }
    .sz-970x250 .panel { width: 670px; padding: 16px 20px 16px 22px; }
    .sz-970x250 h1 { font-size: 22px; margin-bottom: 12px; }
    .sz-970x250 .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
    .sz-970x250 .opt { width: auto; }
    .sz-970x250.is-result .hero .name, .sz-970x250.is-result .hero .kicker, .sz-970x250.is-result .hero .sub { color: #fff; }
    .sz-970x250.is-result .name { font-size: 20px; }
    .sz-970x250.is-result .sub { color: rgba(255,255,255,.8); }
    .sz-970x250.is-result .row { margin-top: 16px; }
    .sz-970x250.is-result .cta { min-width: 240px; flex: 0 0 auto; padding: 0 20px; }
  </style>
</head>
<body>
  <div class="unit" id="unit"></div>
  <script src="/shared.js"></script>
  <script>
    (function () {
      var size = new URLSearchParams(location.search).get("size") || "300x600";
      var compact = size === "300x250" || size === "970x250";
      var unit = document.getElementById("unit");
      var answers = {};
      var spec = null;
      var step = 0;
      var names = { "ai-applied": "IA Aplicada", marketing: "Marketing", biomechanics: "Biomecánica" };
      var LOGO =
        "<div class=\"logo\">" +
        "<svg class=\"mark\" viewBox=\"0 0 24 28\" aria-hidden=\"true\"><path d=\"M12 1.2 L22 5.2 V14.2 C22 20.8 12 26.6 12 26.6 C12 26.6 2 20.8 2 14.2 V5.2 Z\" fill=\"#fff\" fill-opacity=\".1\" stroke=\"#c4a35a\" stroke-width=\"1.2\"/><path d=\"M12 6 V21 M7 12.5 H17\" stroke=\"#f3c1c1\" stroke-width=\"2\" stroke-linecap=\"square\"/></svg>" +
        "<div class=\"brand\">Universidad San Jorge<b>USJ</b></div></div>";

      function api(path, body) {
        if (body) return USJ.api(path, { method: "POST", body: JSON.stringify(body) });
        return USJ.api(path);
      }
      function labelOf(opt) { return compact ? (opt.short_label || opt.label) : opt.label; }
      function navHtml(at, opts) {
        opts = opts || {};
        var n = (spec && spec.steps.length) || 3;
        var dots = "";
        for (var i = 0; i < n; i++) dots += "<i" + (i <= at ? " class=\"on\"" : "") + "></i>";
        var back = (!opts.noBack && at > 0)
          ? "<button type=\"button\" class=\"back\" id=\"back\" aria-label=\"Volver\">←</button>"
          : "<span class=\"back-ph\"></span>";
        return "<div class=\"navline\">" + back + "<div class=\"progress\">" + dots + "</div><span class=\"count\">0" + (at + 1) + " / 0" + n + "</span></div>";
      }
      function paintRemain(data) {
        return (data.remaining || []).map(function (row) {
          return "<span class=\"tag\">" + (names[row.programme_id] || row.programme) + "</span>";
        }).join("");
      }
      function waCtx(payload) {
        return { programme: payload && payload.best && payload.best.programme, labels: (payload && payload.guide_labels) || [] };
      }
      function bindWhatsApp(id, payload) {
        var btn = document.getElementById(id);
        if (btn) btn.onclick = function () { USJ.openWhatsApp(waCtx(payload)); };
      }
      function bindBack() {
        var b = document.getElementById("back");
        if (!b) return;
        b.onclick = function () {
          var ids = spec.steps.map(function (s) { return s.id; });
          delete answers[ids[step]];
          step -= 1;
          delete answers[ids[step]];
          showStep();
        };
      }

      function showStep() {
        unit.className = "unit sz-" + size;
        var s = spec.steps[step];
        unit.innerHTML =
          "<div class=\"hero\">" + LOGO + "<p class=\"kicker\">Másteres oficiales</p></div>" +
          "<div class=\"panel\">" + navHtml(step) +
          "<h1>" + s.title + "</h1>" +
          "<div class=\"remain\" id=\"remain\"></div>" +
          "<div class=\"opts\" id=\"opts\"></div></div>";
        s.options.forEach(function (opt) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "opt";
          btn.textContent = labelOf(opt);
          btn.onclick = function () { choose(s.id, opt.id); };
          document.getElementById("opts").appendChild(btn);
        });
        bindBack();
        api("/api/guide", { answers: answers }).then(function (d) {
          var el = document.getElementById("remain");
          if (el) el.innerHTML = paintRemain(d);
        }).catch(function () {});
      }

      function choose(id, option) {
        answers[id] = option;
        USJ.track("priority_selected", { surface: "ad", size: size, step: id, option: option });
        if (step < spec.steps.length - 1) { step += 1; showStep(); return; }
        USJ.track("profile_submitted", { surface: "ad" });
        api("/api/guide", { answers: answers }).then(showResult).catch(function () { showResult({ fallback: true }); });
      }

      function showResult(payload) {
        USJ.track("recommendation_generated", { surface: "ad", id: payload.best && payload.best.programme_id });
        unit.className = "unit sz-" + size + " is-result";
        var wa = "<div class=\"row\"><button type=\"button\" class=\"cta\" id=\"wa\">Seguir por WhatsApp</button><button type=\"button\" class=\"cta ghost\" id=\"again\">Volver</button></div>";
        if (!payload.best) {
          unit.innerHTML = "<div class=\"hero\">" + LOGO + "</div><div class=\"panel\">" + navHtml(2, { noBack: true }) +
            "<h1>Hablemos por WhatsApp</h1><p class=\"sub\">Este catálogo demo es limitado.</p>" + wa + "</div>";
        } else {
          var b = payload.best;
          var title = payload.has_strong_match ? "Mejor encaje" : "Opción más cercana";
          var pills = "<div class=\"pills\"><span class=\"pill\">" + (b.modality_es || "") + "</span><span class=\"pill\">" + (b.eligibility || "") + "</span></div>";
          if (size === "970x250") {
            unit.innerHTML =
              "<div class=\"hero\">" + LOGO + "<p class=\"kicker\">" + title + "</p><div class=\"name\">" + b.programme + "</div>" +
              "<p class=\"sub\">" + (b.modality_es || "") + "</p></div>" +
              "<div class=\"panel\">" + navHtml(2, { noBack: true }) +
              "<p class=\"score\">" + b.score_pct + "%</p><h1>Encaje con tu perfil</h1>" + pills + wa + "</div>";
          } else if (size === "300x600") {
            unit.innerHTML =
              "<div class=\"hero\">" + LOGO + "<p class=\"kicker\">" + title + "</p><p class=\"score\">" + b.score_pct + "%</p><div class=\"name\">" + b.programme + "</div></div>" +
              "<div class=\"panel\">" + navHtml(2, { noBack: true }) + pills +
              "<p class=\"sub\">" + ((b.reasons || []).slice(0, 2).join(" · ") || "") + "</p>" + wa + "</div>";
          } else {
            unit.innerHTML =
              "<div class=\"hero\">" + LOGO + "</div><div class=\"panel\">" + navHtml(2) +
              "<h1>" + b.programme + "</h1>" + pills + wa + "</div>";
          }
        }
        bindWhatsApp("wa", payload);
        document.getElementById("again").onclick = restart;
      }

      function restart() { answers = {}; step = 0; showStep(); }

      api("/api/guide").then(function (s) { spec = s; showStep(); }).catch(function () {
        unit.className = "unit sz-" + size;
        unit.innerHTML = "<div class=\"hero\">" + LOGO + "</div><div class=\"panel\"><h1>Encuentra tu máster</h1><button type=\"button\" class=\"cta\" id=\"wa\">Seguir por WhatsApp</button></div>";
        bindWhatsApp("wa", {});
      });
    })();
  </script>
</body>
</html>
