<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Anuncios IAB — USJ</title>
  <link rel="stylesheet" href="/ad/ad.css">
</head>
<body>
  <header class="page">
    <p>Creatividades HTML5 a tamaño IAB real, con look de campaña USJ (foto de campus, marino y cruz de San Jorge). <strong>Seguir por WhatsApp</strong> abre la conversación con el máster y el perfil.</p>
    <p><a href="/">Orientador</a> · <a href="/admissions">Admisiones</a></p>
  </header>
  <main class="stage">
    <figure class="slot">
      <figcaption><b>300 × 250</b> · MPU · tamaño real</figcaption>
      <div class="frame" style="width:300px;height:250px">
        <iframe title="USJ 300x250" src="/ad/unit.html?size=300x250" width="300" height="250" scrolling="no"></iframe>
      </div>
    </figure>
    <figure class="slot">
      <figcaption><b>300 × 600</b> · half-page · tamaño real</figcaption>
      <div class="frame" style="width:300px;height:600px">
        <iframe title="USJ 300x600" src="/ad/unit.html?size=300x600" width="300" height="600" scrolling="no"></iframe>
      </div>
    </figure>
    <figure class="slot wide">
      <figcaption><b>970 × 250</b> · billboard escritorio · tamaño real</figcaption>
      <div class="scroller">
        <div class="frame" style="width:970px;height:250px">
          <iframe title="USJ 970x250" src="/ad/unit.html?size=970x250" width="970" height="250" scrolling="no"></iframe>
        </div>
      </div>
    </figure>
  </main>
</body>
</html>
