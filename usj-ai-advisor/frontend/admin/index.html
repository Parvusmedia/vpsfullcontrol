<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo — Orientador USJ</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/demo.css">
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <div class="brand"><span>Universidad San Jorge</span><strong>Catálogo de másteres</strong></div>
    </nav>

    <div id="demo-map-mount" class="demo-map-mount"></div>
    <div id="demo-here-mount"></div>

    <header class="hero hero-step">
      <p class="kicker">Catálogo de másteres</p>
      <h1>Datos estructurados, no memoria del modelo.</h1>
      <p class="lede">Plazas, modalidades y requisitos de acceso de cada máster del orientador.</p>
    </header>

    <div id="cats"></div>
    <p class="footnote"><a href="/">Inicio</a> · <a href="/orientador">Orientador</a></p>
  </div>
  <script src="/shared.js"></script>
  <script src="/demo.js"></script>
  <script>USJ.mountDemoChrome();</script>
  <script>
    USJ.api("/api/programmes").then(function (data) {
      document.getElementById("cats").innerHTML = data.programmes.map(function (p) {
        return '<article class="card" style="margin:16px 0">' +
          '<h2 class="program-title">' + p.name + '</h2>' +
          '<div class="meta"><span class="pill">' + (p.modality_es || p.modality) + '</span><span class="pill">' + p.ects + ' ECTS</span><span class="pill">' + p.places + ' plazas</span></div>' +
          '<p><b>Áreas</b> ' + p.areas.join(", ") + '</p>' +
          '<p><b>Perfiles ideales</b> ' + p.ideal_profiles.join(", ") + '</p>' +
          '<p><b>Objetivos</b> ' + p.goals.join(", ") + '</p>' +
          '<p><b>Acceso preferente</b> ' + (p.eligibility.preferred_backgrounds || []).join(", ") + '</p>' +
          '<p><b>Complementos formativos</b> ' + (p.eligibility.additional_training_possible ? "posibles" : "no listados") + '</p>' +
          '<p class="footnote">' + (p.approved_facts || []).join(" ") + '</p>' +
        '</article>';
      }).join("");
    });
  </script>
</body>
</html>
