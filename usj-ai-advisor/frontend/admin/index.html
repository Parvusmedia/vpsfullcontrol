<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue — USJ AI Student Advisor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <div class="brand"><span>Universidad San Jorge</span><strong>Programme catalogue</strong></div>
      <div class="nav-links"><a href="/">Advisor</a></div>
    </nav>
    <p class="kicker">Read-only demo admin</p>
    <h1>Structured data, not model memory.</h1>
    <p class="lede">Edit <code>backend/data/programmes.json</code> on the server, then restart the service or call <code>POST /api/admin/reload</code>. Future: USJ CMS → programme feed → this file → advisor engine.</p>
    <div id="cats"></div>
  </div>
  <script src="/shared.js"></script>
  <script>
    USJ.api("/api/programmes").then(function (data) {
      document.getElementById("cats").innerHTML = data.programmes.map(function (p) {
        return '<article class="card" style="margin:16px 0">' +
          '<h2 class="program-title">' + p.name + '</h2>' +
          '<div class="meta"><span class="pill">' + p.modality + '</span><span class="pill">' + p.ects + ' ECTS</span><span class="pill">' + p.places + ' places</span></div>' +
          '<p><b>Areas</b> ' + p.areas.join(", ") + '</p>' +
          '<p><b>Ideal profiles</b> ' + p.ideal_profiles.join(", ") + '</p>' +
          '<p><b>Goals</b> ' + p.goals.join(", ") + '</p>' +
          '<p><b>Eligibility preferred</b> ' + (p.eligibility.preferred_backgrounds || []).join(", ") + '</p>' +
          '<p><b>Additional training</b> ' + (p.eligibility.additional_training_possible ? "possible" : "not listed") + '</p>' +
          '<p class="footnote">' + (p.approved_facts || []).join(" ") + '</p>' +
        '</article>';
      }).join("");
    });
  </script>
</body>
</html>
