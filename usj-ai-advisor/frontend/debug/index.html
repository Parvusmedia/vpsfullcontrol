<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Depuración — Orientador USJ</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="wrap">
    <nav class="nav"><div class="brand"><strong>Registro de eventos</strong></div><a href="/">Volver</a></nav>
    <p class="lede">Los eventos del navegador se quedan en esta sesión y también se envían a <code>/api/events</code>. Añade <code>?debug=1</code> en el orientador para ver el perfil y las puntuaciones.</p>
    <pre class="debug open" id="out"></pre>
  </div>
  <script src="/shared.js"></script>
  <script>
    Promise.all([
      Promise.resolve(USJ.events()),
      USJ.api("/api/events").catch(function () { return { events: [] }; })
    ]).then(function (pair) {
      document.getElementById("out").textContent = JSON.stringify({ local: pair[0], server: pair[1].events }, null, 2);
    });
  </script>
</body>
</html>
