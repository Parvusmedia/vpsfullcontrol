<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admisiones — Orientador USJ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .prospect { margin: 18px 0; }
    .intent { font-family: var(--serif); font-size: 28px; color: var(--forest); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <div class="brand"><span>Universidad San Jorge</span><strong>Mesa de admisiones</strong></div>
      <div class="nav-links"><a href="/">Orientador</a><a href="/ad">Anuncio</a></div>
    </nav>
    <p class="kicker">Lo que recibe el equipo comercial</p>
    <h1>Contexto cualificado, no un formulario vacío.</h1>
    <p class="lede">Cada interesado llega con perfil, puntuación, alternativas, preguntas e intención. Los datos personales solo aparecen si pidió hablar con un asesor.</p>
    <div id="list"></div>
  </div>
  <script src="/shared.js"></script>
  <script>
    USJ.api("/api/leads").then(function (data) {
      var root = document.getElementById("list");
      if (!data.leads.length) {
        root.innerHTML = '<div class="card"><p>Aún no hay interesados. Completa el orientador y pulsa Seguir por WhatsApp.</p></div>';
        return;
      }
      root.innerHTML = data.leads.map(function (lead) {
        var rec = lead.recommendation || {};
        var profile = lead.profile || {};
        return '<article class="card prospect">' +
          '<div class="kicker">Nuevo interesado</div>' +
          '<h2 class="program-title">' + (lead.name || "Interesado") + '</h2>' +
          '<p class="intent">Intención ' + (lead.lead_intent || "LOW") + '</p>' +
          '<div class="grid2">' +
          '<div><p class="label">Máster recomendado</p><p>' + (rec.programme || "—") + '<br>' + (rec.score_pct || Math.round((rec.score||0)*100)) + '% de encaje · ' + (rec.eligibility || "") + '</p></div>' +
          '<div><p class="label">Perfil</p><p>' + (profile.current_role || profile.education || "—") + '<br>' + (profile.experience_years != null ? profile.experience_years + " años de experiencia" : "") + '</p></div>' +
          '<div><p class="label">Objetivo</p><p>' + (profile.goal || "—") + '</p></div>' +
          '<div><p class="label">Prioridad</p><p>' + (lead.priority || profile.priority || "—") + '</p></div>' +
          '</div>' +
          '<p class="label">Intereses</p><p>' + ((profile.interests || []).join(", ") || "—") + '</p>' +
          '<p class="label">Preguntas</p><p>' + ((lead.questions_asked || []).join(" · ") || "Ninguna todavía") + '</p>' +
          '<p class="label">Email / teléfono</p><p>' + lead.email + (lead.phone ? " · " + lead.phone : "") + '</p>' +
        '</article>';
      }).join("");
    }).catch(function () {
      document.getElementById("list").innerHTML = '<div class="card">Vamos a ayudarte a encontrar el programa adecuado.</div>';
    });
  </script>
</body>
</html>
