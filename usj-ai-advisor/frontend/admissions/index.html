<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admisiones — Orientador USJ</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/demo.css">
  <style>
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <div class="brand"><span>Universidad San Jorge</span><strong>Mesa de admisiones</strong></div>
    </nav>

    <div id="demo-map-mount" class="demo-map-mount"></div>
    <div id="demo-here-mount"></div>

    <header class="hero hero-step">
      <p class="kicker">Paso 3 · Conversión</p>
      <h1>Contexto cualificado, no un formulario vacío.</h1>
      <p class="lede">Cada interesado llega con perfil, puntuación, alternativas y respuestas del orientador.</p>
    </header>

    <div id="list"></div>
    <div id="demo-linear-mount"></div>
  </div>
  <script src="/shared.js"></script>
  <script src="/demo.js"></script>
  <script>USJ.mountDemoChrome();</script>
  <script>
    function intentClass(intent) {
      var value = String(intent || "LOW").toUpperCase();
      if (value === "HIGH") return "intent-chip intent-high";
      if (value === "MEDIUM") return "intent-chip intent-medium";
      return "intent-chip intent-low";
    }

    function renderLeadCard(lead) {
      var rec = lead.recommendation || {};
      var profile = lead.profile || {};
      return '<article class="card prospect">' +
        '<div class="kicker">Interesado</div>' +
        '<h2 class="program-title">' + (lead.name || "Interesado") + '</h2>' +
        '<span class="' + intentClass(lead.lead_intent) + '">Intención ' + (lead.lead_intent || "LOW") + '</span>' +
        '<div class="grid2">' +
        '<div><p class="label">Máster recomendado</p><p>' + (rec.programme || "—") + '<br>' + (rec.score_pct || Math.round((rec.score||0)*100)) + '% de encaje · ' + (rec.eligibility || "") + '</p></div>' +
        '<div><p class="label">Perfil</p><p>' + (profile.current_role || profile.education || "—") + '<br>' + (profile.experience_years != null ? profile.experience_years + " años de experiencia" : "") + '</p></div>' +
        '<div><p class="label">Objetivo</p><p>' + (profile.goal || "—") + '</p></div>' +
        '<div><p class="label">Prioridad</p><p>' + (lead.priority || profile.priority || "—") + '</p></div>' +
        '</div>' +
        '<p class="label">Intereses</p><p>' + ((profile.interests || []).join(", ") || "—") + '</p>' +
        '<p class="label">Preguntas</p><p>' + ((lead.questions_asked || []).join(" · ") || "Ninguna todavía") + '</p>' +
        '<p class="label">Email / teléfono</p><p>' + lead.email + (lead.phone ? " · " + lead.phone : "") + '</p>' +
      '</article>';
    }

    USJ.api("/api/leads").then(function (data) {
      var root = document.getElementById("list");
      if (!data.leads.length) {
        root.innerHTML = '<div class="card"><p>Aún no hay interesados registrados.</p></div>';
        return;
      }
      var live = data.leads.filter(function (l) { return !l.demo_seed; });
      var seeds = data.leads.filter(function (l) { return l.demo_seed; });
      var ordered = live.concat(seeds);
      root.innerHTML = ordered.map(renderLeadCard).join("");
    }).catch(function () {
      document.getElementById("list").innerHTML = '<div class="card">No se pudo cargar la lista de interesados.</div>';
    });
  </script>
</body>
</html>
