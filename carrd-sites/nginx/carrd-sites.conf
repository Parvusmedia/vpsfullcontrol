server {
    if ($host = visitdubai.pmediaplus.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name visitdubai.pmediaplus.com;
    return 404; # managed by Certbot


}

