# Sitios estáticos copiados de Carrd.
# aena.pmediaplus.com no entra: tiene zona DNS propia y la página pide contraseña.
# Los .mp4 de visitdubai y visitredsea están en el VPS y fuera de git (.gitignore).

server {
    server_name visitdubai.pmediaplus.com;
    root /opt/apps/carrd-sites/visitdubai.pmediaplus.com;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/visitdubai.pmediaplus.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/visitdubai.pmediaplus.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

