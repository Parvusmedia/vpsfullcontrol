><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Next Match y Previous Match</title></head><body><div style="text-align: center; margin-bottom: 20px;"><button id="prevButton">Previous Match</button><button id="nextButton">Next Match</button></div><script type="text/javascript">
									// Función para obtener parámetros de la URL
									function getParameterByName(name) {
									let url = window.location.href;
									name = name.replace(/[\[\]]/g, "\\$&");
									let regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)");
									let results = regex.exec(url);
									if (!results) return null;
									if (!results[2]) return '';
									return decodeURIComponent(results[2].replace(/\+/g, " "));
									}
									
									// Código del banner embebido
									var embedConfig = {

									function updateURL(newFeedRowValue) {

									window.location.href = window.location.pathname + "?feedrow=" + newFeedRowValue;
									}
									}
									
									// Acción al hacer clic en el botón "Next Match"
									document.getElementById('nextButton').onclick = function() {
									let feedRowValue = parseInt(getParameterByName('feedrow')) || 1;
									let nextFeedRowValue = feedRowValue + 1;
									updateURL(nextFeedRowValue); // Incrementar el valor de feedrow
