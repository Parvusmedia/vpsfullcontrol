name: ssl-friendinme-app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ssl-friendinme-app.yml"

concurrency:
  group: ssl-friendinme-app
  cancel-in-progress: false

jobs:
  certbot:
    runs-on: self-hosted
    steps:
      - name: Restart friendinme + verify SSH/TLS
        run: |
          set -euo pipefail
          # Ensure root key present
          printf '%s\n' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKgn07nToDRuZWb4fq2DL9ImtRQJmk1ewNMFW8WcfXjH cursor-temp-friendinme' > /tmp/root-ak
          sudo mkdir -p /root/.ssh
          sudo cp /tmp/root-ak /root/.ssh/authorized_keys
          sudo chmod 700 /root/.ssh
          sudo chmod 600 /root/.ssh/authorized_keys
          printf '%s\n' 'PermitRootLogin yes' 'PasswordAuthentication yes' 'PubkeyAuthentication yes' > /tmp/99-root-login.conf
          sudo cp /tmp/99-root-login.conf /etc/ssh/sshd_config.d/99-root-login.conf
          sudo systemctl restart ssh || sudo systemctl restart sshd || true
          sleep 2

          echo "=== services before ==="
          sudo systemctl is-active friendinme-api friendinme-web nginx || true
          sudo systemctl restart friendinme-api friendinme-web || true
          sleep 3
          echo "=== services after ==="
          sudo systemctl is-active friendinme-api friendinme-web nginx || true
          sudo systemctl --no-pager -l status friendinme-api friendinme-web | sed -n '1,80p' || true
          echo "=== ports ==="
          ss -tlnp | grep -E ':3010|:8000|:443' || true
          echo "=== authorized_keys ==="
          sudo cp /root/.ssh/authorized_keys /tmp/ak-check
          sudo chown ops:ops /tmp/ak-check
          wc -l /tmp/ak-check
          cat /tmp/ak-check
          echo "=== https ==="
          curl -sIk https://friendinme.app 2>&1 | head -15 || true
          curl -sS --max-time 5 http://127.0.0.1:3010/ 2>&1 | head -5 || true
          curl -sS --max-time 5 http://127.0.0.1:8000/api/health 2>&1 | head -5 || true
