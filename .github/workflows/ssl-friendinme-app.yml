name: ssl-friendinme-app

# Renueva/emite cert Let's Encrypt para friendinme.app (runner self-hosted).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ssl-friendinme-app.yml"

concurrency:
  group: ssl-friendinme-app
  cancel-in-progress: false

jobs:
  certbot:
    runs-on: self-hosted
    steps:
      - name: Certbot friendinme.app
        run: |
          set -euo pipefail
          printf '%s\n' 'ops ALL=(root) NOPASSWD: /usr/bin/certbot, /usr/bin/certbot *, /usr/sbin/nginx, /usr/sbin/nginx *, /usr/bin/ln, /usr/bin/ln *, /bin/chmod, /bin/chmod *' > /tmp/ops-ssl-sudoers
          sudo cp /tmp/ops-ssl-sudoers /etc/sudoers.d/ops-ssl
          sudo chmod 440 /etc/sudoers.d/ops-ssl
          if [ -f /opt/apps/friendinme/deploy/nginx-friendinme.conf ]; then
            sudo cp /opt/apps/friendinme/deploy/nginx-friendinme.conf /etc/nginx/sites-available/friendinme
            sudo cp /opt/apps/friendinme/deploy/nginx-friendinme.conf /etc/nginx/sites-enabled/friendinme
            sudo nginx -t
            sudo systemctl reload nginx
          fi
          sudo certbot --nginx \
            -d friendinme.app \
            -d www.friendinme.app \
            --non-interactive \
            --agree-tos \
            --register-unsafely-without-email \
            --redirect \
            --keep-until-expiring
          sudo nginx -t
          sudo systemctl reload nginx
          curl -sIk https://friendinme.app | head -10 || true
