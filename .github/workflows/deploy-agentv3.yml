name: deploy-agentv3

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout agentv3
        uses: actions/checkout@v4
        with:
          repository: Parvusmedia/agentv3
          ref: main
          path: agentv3
          token: ${{ secrets.AGENTV3_REPO_TOKEN }}

      - name: Sync to /opt/ai-agent-v3
        run: |
          sudo rsync -a --delete \
            --exclude '.git' \
            --exclude 'venv' \
            --exclude '__pycache__' \
            agentv3/ /opt/ai-agent-v3/
          sudo chown -R cursorbot:cursorbot /opt/ai-agent-v3

      - name: Restart service
        run: |
          sudo systemctl restart ai-agent-v3.service

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8004/ >/dev/null; then
              echo "OK: ai-agent-v3 up"
              exit 0
            fi
            sleep 1
          done

          echo "ERROR: ai-agent-v3 did not come up"
          sudo systemctl status ai-agent-v3.service --no-pager -l | sed -n '1,120p'
          exit 1
