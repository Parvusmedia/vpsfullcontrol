name: vps-ssh-access

# Acceso SSH operativo en el VPS (self-hosted).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vps-ssh-access.yml"
      - "scripts/setup-ssh-access.sh"

concurrency:
  group: vps-ssh-access
  cancel-in-progress: false

jobs:
  setup:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and run setup-ssh-access
        run: |
          set -euo pipefail
          # Instala el script como binario root-ejecutable vía sudoers dedicado
          sudo cp scripts/setup-ssh-access.sh /usr/local/sbin/parvus-ssh-setup
          sudo chmod 755 /usr/local/sbin/parvus-ssh-setup
          printf '%s\n' 'ops ALL=(root) NOPASSWD: /usr/local/sbin/parvus-ssh-setup' > /tmp/ops-parvus-ssh
          sudo cp /tmp/ops-parvus-ssh /etc/sudoers.d/ops-parvus-ssh
          sudo chmod 440 /etc/sudoers.d/ops-parvus-ssh
          sudo /usr/local/sbin/parvus-ssh-setup
