name: deploy-prosegurlatam

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout prosegurlatam
        uses: actions/checkout@v4
        with:
          repository: Parvusmedia/prosegurlatam
          ref: main
          path: prosegurlatam
          token: ${{ secrets.PROSEGURLATAM_REPO_TOKEN || github.token }}

      - name: Sync to /home/cursorbot/prosegurlatam
        run: |
          sudo rsync -a --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.env' \
            --exclude 'tmp_upload' \
            --exclude 'data/*.json' \
            prosegurlatam/ /home/cursorbot/prosegurlatam/
          sudo chown -R cursorbot:cursorbot /home/cursorbot/prosegurlatam

      - name: Ensure required data files exist
        run: |
          sudo -u cursorbot bash -lc '
            cd /home/cursorbot/prosegurlatam
            test -f data/client_panel_regions.json || cp -n data/client_panel_regions.example.json data/client_panel_regions.json
            test -f data/client_panel_users.json   || cp -n data/client_panel_users.example.json   data/client_panel_users.json
          '

      - name: Restart service and wait
        run: |
          sudo /bin/systemctl status client-ficha-panel.service --no-pager -l | sed -n '1,160p'

          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8015/ >/dev/null; then
              echo "OK: prosegurlatam up"
              exit 0
            fi
            sleep 1
          done

          echo "ERROR: service did not come up"
          sudo /bin/systemctl status client-ficha-panel.service --no-pager -l | sed -n '1,160p'
          exit 1
