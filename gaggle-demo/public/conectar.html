<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ngaged · Vincular LinkedIn</title>
    <link rel="stylesheet" href="/assets/demo.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <div>
          <span class="badge">Ngaged</span>
          <h1>Vincula tu LinkedIn</h1>
          <p id="lead">Preparando tu invitación…</p>
        </div>
      </header>
      <div class="card">
        <div id="connect-status" class="status">Cargando…</div>
        <div class="row" id="connect-actions" hidden>
          <a id="btn-oauth" class="btn btn-primary" href="#" target="_blank" rel="noopener">Conectar LinkedIn</a>
          <button type="button" class="btn btn-secondary" id="btn-done">Ya conecté — comprobar</button>
        </div>
        <p class="meta"><a href="/">Ir al panel Ngaged</a></p>
      </div>
    </div>
    <script>
      (async function () {
        const params = new URLSearchParams(location.search);
        const token = params.get('token') || '';
        const statusEl = document.getElementById('connect-status');
        const actions = document.getElementById('connect-actions');
        const lead = document.getElementById('lead');
        const oauth = document.getElementById('btn-oauth');
        const done = document.getElementById('btn-done');

        if (!token) {
          statusEl.textContent = 'Enlace incompleto.';
          statusEl.className = 'status err';
          return;
        }

        try {
          const res = await fetch('/api/connect-status?token=' + encodeURIComponent(token));
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || 'Error');
          lead.textContent = 'Hola ' + (data.name || data.email || '') + ', autoriza tu cuenta para recibir campañas.';
          if (data.platformLinked) {
            statusEl.textContent = 'Tu LinkedIn ya está vinculado. Puedes cerrar esta página.';
            statusEl.className = 'status ok';
            return;
          }
          if (data.linkedinConnectUrl) {
            oauth.href = data.linkedinConnectUrl;
            actions.hidden = false;
            statusEl.textContent = 'Paso 1: abre el enlace y autoriza LinkedIn. Paso 2: pulsa comprobar.';
            statusEl.className = 'status';
          } else {
            statusEl.textContent =
              'Tu administrador debe activar enlaces automáticos (Workspace) o asignarte la cuenta manualmente. Comparte este enlace con tu admin si hace falta.';
            statusEl.className = 'status err';
          }
        } catch (e) {
          statusEl.textContent = e.message || 'No pudimos cargar la invitación.';
          statusEl.className = 'status err';
        }

        done.addEventListener('click', async () => {
          statusEl.textContent = 'Comprobando conexión…';
          statusEl.className = 'status';
          try {
            const res = await fetch('/api/connect-complete', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token }),
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || 'Error');
            statusEl.textContent = data.message || 'Listo.';
            statusEl.className = 'status ok';
            actions.hidden = true;
          } catch (e) {
            statusEl.textContent = e.message;
            statusEl.className = 'status err';
          }
        });
      })();
    </script>
  </body>
</html>
