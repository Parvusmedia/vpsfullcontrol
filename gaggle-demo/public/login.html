<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ngaged · Acceso administradores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/demo.css?v=20261105-2fa" />
  </head>
  <body class="admin-body">
    <div class="public-shell min-vh-100 d-flex flex-column">
      <header class="public-topbar border-bottom bg-white py-3">
        <div class="d-flex align-items-center gap-3 public-topbar-brand mx-auto" style="max-width: 420px; width: 100%">
          <span class="brand-mark flex-shrink-0">N</span>
          <div>
            <strong class="d-block">Ngaged</strong>
            <small class="text-muted public-topbar-tagline">Panel de administración</small>
          </div>
        </div>
      </header>
      <main class="flex-grow-1 public-main public-main--center">
        <div class="card shadow-sm public-card w-100" style="max-width: 420px">
          <div class="card-body p-4">
            <h1 class="h4 mb-1" id="login-title">Iniciar sesión</h1>
            <p class="text-muted small mb-4" id="login-lead">Acceso para administradores del programa de employee advocacy.</p>
            <div id="login-error" class="alert alert-danger py-2" hidden></div>
            <div id="login-info" class="alert alert-info py-2" hidden></div>

            <form id="login-form" class="vstack gap-3">
              <div>
                <label class="form-label small" for="login-email">Email</label>
                <input class="form-control" id="login-email" type="email" autocomplete="username" required />
              </div>
              <div>
                <label class="form-label small" for="login-password">Contraseña</label>
                <input class="form-control" id="login-password" type="password" autocomplete="current-password" required />
              </div>
              <button type="submit" class="btn btn-primary w-100">Continuar</button>
            </form>

            <form id="verify-form" class="vstack gap-3" hidden>
              <p class="small text-muted mb-0" id="verify-hint">Introduce el código de 6 dígitos enviado a tu email.</p>
              <div>
                <label class="form-label small" for="login-code">Código de verificación</label>
                <input
                  class="form-control text-center fs-4 letter-spacing-wide"
                  id="login-code"
                  type="text"
                  inputmode="numeric"
                  pattern="[0-9]{6}"
                  maxlength="6"
                  autocomplete="one-time-code"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary w-100">Verificar y entrar</button>
              <button type="button" class="btn btn-link btn-sm" id="resend-code">Reenviar código</button>
              <button type="button" class="btn btn-link btn-sm text-muted" id="back-to-login">Volver al inicio de sesión</button>
            </form>

            <div class="mt-4 pt-3 border-top" id="google-block">
              <a id="google-login" class="btn btn-outline-secondary w-100" href="/api/auth-google">Continuar con Google</a>
              <p class="text-muted small mt-2 mb-0" id="google-hint" hidden>
                Solo cuentas Google ya autorizadas por el administrador principal.
              </p>
            </div>
          </div>
          <div class="card-footer bg-light border-0 py-3 public-footer">
            <a href="/privacidad" class="small">Privacidad</a>
          </div>
        </div>
      </main>
    </div>
    <style>
      .letter-spacing-wide {
        letter-spacing: 0.35em;
      }
    </style>
    <script>
      (function () {
        let loginToken = '';
        const params = new URLSearchParams(location.search);
        const errMap = {
          google_not_configured: 'Google Sign-In no está configurado en el servidor.',
          google_denied: 'Inicio con Google cancelado.',
          google_token: 'No pudimos validar Google. Inténtalo de nuevo.',
          google_verify: 'Token de Google inválido.',
          google_email: 'Google no verificó tu email.',
          no_access: 'Tu email de Google no tiene acceso. Pide al administrador que te invite.',
        };
        const errEl = document.getElementById('login-error');
        const infoEl = document.getElementById('login-info');
        const loginForm = document.getElementById('login-form');
        const verifyForm = document.getElementById('verify-form');
        const googleBlock = document.getElementById('google-block');

        function showError(msg) {
          infoEl.hidden = true;
          errEl.textContent = msg;
          errEl.hidden = !msg;
        }
        function showInfo(msg) {
          errEl.hidden = true;
          infoEl.textContent = msg;
          infoEl.hidden = !msg;
        }

        const err = params.get('error');
        if (err && errMap[err]) showError(errMap[err]);

        fetch('/api/admin-me', { credentials: 'include' })
          .then((r) => r.json())
          .then((d) => {
            if (d.ok && d.auth === 'session') location.href = '/';
            if (d.googleLoginAvailable) {
              document.getElementById('google-hint').hidden = false;
            } else {
              document.getElementById('google-login').classList.add('disabled');
              document.getElementById('google-login').setAttribute('aria-disabled', 'true');
              document.getElementById('google-login').href = '#';
            }
          })
          .catch(() => {});

        function showVerifyStep(masked) {
          loginForm.hidden = true;
          googleBlock.hidden = true;
          verifyForm.hidden = false;
          document.getElementById('login-title').textContent = 'Verificación en dos pasos';
          document.getElementById('login-lead').textContent = 'Protegemos el acceso con un código enviado a tu correo.';
          document.getElementById('verify-hint').textContent =
            'Código enviado a ' + (masked || 'tu email') + '. Caduca en 10 minutos.';
          document.getElementById('login-code').focus();
        }

        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          showError('');
          const email = document.getElementById('login-email').value.trim();
          const password = document.getElementById('login-password').value;
          try {
            const res = await fetch('/api/admin-login', {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password }),
            });
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error(data.error || 'Error de acceso');
            if (data.requires2fa) {
              loginToken = data.loginToken;
              showVerifyStep(data.emailMasked);
              showInfo(data.message || 'Revisa tu bandeja de entrada.');
              return;
            }
            location.href = '/';
          } catch (ex) {
            showError(ex.message || 'Error');
          }
        });

        verifyForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          showError('');
          const code = document.getElementById('login-code').value.replace(/\D/g, '');
          try {
            const res = await fetch('/api/admin-login-verify', {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ loginToken, code }),
            });
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error(data.error || 'Código incorrecto');
            location.href = '/';
          } catch (ex) {
            showError(ex.message || 'Error');
          }
        });

        document.getElementById('resend-code').addEventListener('click', async () => {
          if (!loginToken) return;
          showError('');
          try {
            const res = await fetch('/api/admin-login-resend', {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ loginToken }),
            });
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo reenviar');
            loginToken = data.loginToken;
            showInfo(data.message || 'Nuevo código enviado.');
          } catch (ex) {
            showError(ex.message || 'Error');
          }
        });

        document.getElementById('back-to-login').addEventListener('click', () => {
          loginToken = '';
          verifyForm.hidden = true;
          loginForm.hidden = false;
          googleBlock.hidden = false;
          document.getElementById('login-title').textContent = 'Iniciar sesión';
          document.getElementById('login-lead').textContent =
            'Acceso para administradores del programa de employee advocacy.';
          showError('');
          showInfo('');
        });
      })();
    </script>
  </body>
</html>
