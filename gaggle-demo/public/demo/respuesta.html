<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ngaged · Demo · Respuesta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/demo.css?v=20261113-demo" />
  </head>
  <body class="admin-body">
    <div class="demo-example-banner alert alert-warning border-0 rounded-0 mb-0 py-2 text-center small">
      <strong>Vista de ejemplo</strong> · Pantalla tras pulsar un botón del email (sin llamar a LinkedIn)
    </div>
    <div class="public-shell min-vh-100 d-flex flex-column">
      <header class="public-topbar border-bottom bg-white py-3">
        <div class="d-flex align-items-center gap-3 public-topbar-brand px-3">
          <span class="brand-mark flex-shrink-0">N</span>
          <div>
            <strong>Ngaged</strong>
            <small class="text-muted public-topbar-tagline">Campaña LinkedIn</small>
          </div>
        </div>
      </header>
      <main class="flex-grow-1 public-main public-main--center px-3">
        <div class="card shadow-sm public-card w-100">
          <div class="card-body">
            <h1 class="h4 mb-3">Tu respuesta</h1>
            <div id="go-status" class="alert alert-success py-2" role="status"></div>
            <p id="go-hint" class="small text-muted mb-3" hidden></p>
            <p class="small text-muted mb-3">En producción esta página se abre al pulsar el enlace del email y Ngaged publica la acción en LinkedIn por ti.</p>
            <div class="btn-group btn-group-sm flex-wrap mb-3" role="group" aria-label="Tipo de respuesta">
              <a class="btn btn-outline-secondary" href="?v=like_repost">Me gusta + Repost</a>
              <a class="btn btn-outline-secondary" href="?v=repost">Repost</a>
              <a class="btn btn-outline-secondary" href="?v=like">Me gusta</a>
              <a class="btn btn-outline-secondary" href="?v=decline">Ignorar</a>
            </div>
            <a href="/demo/bandeja.html" class="small">← Volver al email</a>
          </div>
        </div>
      </main>
    </div>
    <script>
      (function () {
        const v = new URLSearchParams(location.search).get('v') || 'like_repost';
        const messages = {
          like_repost: '¡Listo! Me gusta y repost publicados en LinkedIn.',
          repost: '¡Listo! Repost publicado en LinkedIn.',
          like: '¡Listo! Me gusta registrado en LinkedIn.',
          decline: 'Has ignorado esta campaña. No se publicará nada.',
        };
        const hints = {
          like_repost: 'En producción hay una pausa de 10–20 s entre me gusta y repost.',
        };
        const el = document.getElementById('go-status');
        const hint = document.getElementById('go-hint');
        el.textContent = messages[v] || messages.like_repost;
        el.className =
          'alert py-2 ' + (v === 'decline' ? 'alert-secondary' : 'alert-success');
        if (hints[v]) {
          hint.textContent = hints[v];
          hint.hidden = false;
        } else {
          hint.hidden = true;
        }
      })();
    </script>
  </body>
</html>
