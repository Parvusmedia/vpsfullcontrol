# Ngaged — ngaged.pmediaplus.com
# DNS A/AAAA must point to this VPS (87.106.194.137), same as prosegur.pmediaplus.com.
#
# Install:
#   sudo cp /opt/apps/gaggle-demo/deploy/nginx-ngaged.pmediaplus.com.conf \
#     /etc/nginx/sites-available/ngaged.pmediaplus.com
#   sudo ln -sf /etc/nginx/sites-available/ngaged.pmediaplus.com \
#     /etc/nginx/sites-enabled/ngaged.pmediaplus.com
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ngaged.pmediaplus.com

upstream gaggle_demo_app {
    server 127.0.0.1:8790;
}

server {
    listen 80;
    listen [::]:80;
    server_name ngaged.pmediaplus.com;

    client_max_body_size 4M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://gaggle_demo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
