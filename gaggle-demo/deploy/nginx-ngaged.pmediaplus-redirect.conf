# Permanent redirect legacy host → https://ngaged.app
# Cert paths from Let's Encrypt for ngaged.pmediaplus.com

server {
    listen 80;
    listen [::]:80;
    server_name ngaged.pmediaplus.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://ngaged.app$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ngaged.pmediaplus.com;

    ssl_certificate /etc/letsencrypt/live/ngaged.pmediaplus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ngaged.pmediaplus.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ngaged.app$request_uri;
}
