name: consultant-radar

on:
  push:
    paths:
      - "consultant-radar/**"
      - ".github/workflows/consultant-radar.yml"
  pull_request:
    paths:
      - "consultant-radar/**"
      - ".github/workflows/consultant-radar.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: consultant-radar
        run: python3 -m unittest discover -s tests -v
