# home.pmediaplus.com — Hogar Finanzas (PHP estático + API)
# Instalar en /etc/nginx/sites-available/ y enlazar en sites-enabled.
# Ajusta root y fastcgi_pass según tu PHP-FPM.

server {
    listen 80;
    listen [::]:80;
    server_name home.pmediaplus.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    root /opt/apps/home-finance/public;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
